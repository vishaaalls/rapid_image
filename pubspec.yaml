name: rapid_image
description: >-
  Faster PNG encoding for package:image. A drop-in import that filters and
  compresses PNG data in Rust, in parallel on every core.
version: 0.2.0
repository: https://github.com/vishaaalls/rapid_image
topics: [image, png, performance, compression]

environment:
  sdk: ^3.6.0

dependencies:
  code_assets: ^2.2.0
  crypto: ^3.0.0
  ffi: ^2.1.0
  hooks: ^2.2.0
  image: ^4.9.0
  rapid_archive: ^0.2.0

dev_dependencies:
  archive: ^4.0.0
  test: ^1.25.0

# When this package is the root (its own tests, benchmarks), build the Rust
# code in this checkout instead of downloading a release binary.
hooks:
  user_defines:
    rapid_image:
      from_source: true
