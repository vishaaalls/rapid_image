[package]
name = "rapid_image"
version = "0.3.0"
edition = "2024"
description = "Rust core for the rapid_image Dart package: PNG and JPEG coding, resizing and filters."
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
libdeflate-sys = "1.26"
rayon = "1.10"
crc32fast = "1.4"
zune-jpeg = "0.4"
jpeg-encoder = "0.6"
png = "0.17"
fast_image_resize = { version = "5", features = ["rayon"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
