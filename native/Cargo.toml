[package]
name = "rapid_image"
version = "0.3.0"
edition = "2024"
description = "Rust core for the rapid_image Dart package: PNG and JPEG coding, resizing and filters."
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
zune-jpeg = "0.4"
jpeg-encoder = "0.6"
png = "0.17"

# Native: rayon for every core. The WebAssembly build is single-threaded, so
# it leaves rayon out (ops.rs has a sequential stand-in).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.rayon]
version = "1.10"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.fast_image_resize]
version = "5"
features = ["rayon"]
[target.'cfg(target_arch = "wasm32")'.dependencies.fast_image_resize]
version = "5"
default-features = false

# The PNG encoder (native only): libdeflate is C, which the WebAssembly build
# leaves out.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
libdeflate-sys = "1.26"
crc32fast = "1.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
